<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a05"/>
      <stop offset="50%" stop-color="#2d1109"/>
      <stop offset="100%" stop-color="#0a0503"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with gold border -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.8"/>

  <!-- Film Reel circles in corners -->
  <g fill="url(#gold)" opacity="0.3">
    <circle cx="64" cy="64" r="16"/>
    <circle cx="448" cy="64" r="16"/>
    <circle cx="64" cy="448" r="16"/>
    <circle cx="448" cy="448" r="16"/>
  </g>

  <!-- Film Clapperboard / Phone Forehead Motif -->
  <g transform="translate(106, 90)">
    <!-- Clapper top stick -->
    <path d="M 10 30 L 290 0 L 285 45 L 5 75 Z" fill="url(#gold)"/>
    <polygon points="40,26 65,23 55,68 30,71" fill="#1a0a05"/>
    <polygon points="110,18 135,15 125,60 100,63" fill="#1a0a05"/>
    <polygon points="180,10 205,7 195,52 170,55" fill="#1a0a05"/>
    <polygon points="250,2 275,-1 265,44 240,47" fill="#1a0a05"/>

    <!-- Main board / Phone screen representing forehead game -->
    <rect x="10" y="80" width="280" height="190" rx="28" fill="#160805" stroke="url(#gold)" stroke-width="5"/>
    <rect x="25" y="95" width="250" height="160" rx="18" fill="url(#ruby)"/>

    <!-- Forehead Smile / Tilt indicator -->
    <path d="M 80 185 Q 150 240 220 185" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Stars -->
    <polygon points="150,115 156,132 174,132 159,143 165,160 150,149 135,160 141,143 126,132 144,132" fill="url(#gold)"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="380" font-family="'Cinzel', 'Outfit', sans-serif" font-size="44" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="2" filter="url(#glow)">MANA</text>
  <text x="256" y="428" font-family="'Outfit', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">HEADS UP</text>
  <text x="256" y="468" font-family="'Ramabhadra', sans-serif" font-size="22" font-weight="700" fill="#ffb300" text-anchor="middle">సినిమా చెప్పు! 🎬</text>
</svg>
